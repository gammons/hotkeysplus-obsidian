name: Build obsidian plugin

on:
  push:
    tags:
      - '*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install, test, and build
        run: |
          npm install
          npm test
          npm run build
      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            main.js
            manifest.json
